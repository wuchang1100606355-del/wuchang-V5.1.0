<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 總成小 J - 最高權限開發者 UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #1e293b;
            --card-bg: #334155;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }
        
        .supervisor-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        .supervisor-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        
        .supervisor-card:hover {
            transform: translateY(-5px);
        }
        
        .capability-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin: 3px;
        }
        
        .badge-enabled {
            background: var(--success-color);
            color: white;
        }
        
        .badge-disabled {
            background: #6b7280;
            color: white;
        }
        
        .permission-test {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .test-passed {
            background: #d1fae5;
            border-left: 4px solid var(--success-color);
        }
        
        .test-failed {
            background: #fee2e2;
            border-left: 4px solid var(--danger-color);
        }
        
        .command-input {
            background: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
        }
        
        .command-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-active {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }
        
        .status-inactive {
            background: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="supervisor-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-0">
                        <i class="bi bi-robot"></i> AI 總成小 J
                    </h1>
                    <p class="text-muted mb-0">最高權限開發者 UI (Supervisor U)</p>
                </div>
                <div class="col-md-4 text-end">
                    <span class="status-indicator status-active"></span>
                    <span id="statusText">系統運行中</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <!-- 系統狀態 -->
        <div class="supervisor-card">
            <h3><i class="bi bi-speedometer2"></i> 系統狀態</h3>
            <div id="systemStatus" class="mt-3">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">載入中...</span>
                </div>
            </div>
        </div>
        
        <!-- 能力清單 -->
        <div class="supervisor-card">
            <h3><i class="bi bi-list-check"></i> 能力清單</h3>
            <div id="capabilitiesList" class="mt-3">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">載入中...</span>
                </div>
            </div>
        </div>
        
        <!-- 權限測試 -->
        <div class="supervisor-card">
            <h3><i class="bi bi-shield-check"></i> 權限測試</h3>
            <button class="btn btn-primary mt-3" onclick="runPermissionTest()">
                <i class="bi bi-play-circle"></i> 執行完整權限測試
            </button>
            <div id="permissionTestResults" class="mt-3"></div>
        </div>
        
        <!-- 命令執行 -->
        <div class="supervisor-card">
            <h3><i class="bi bi-terminal"></i> 命令執行</h3>
            <div class="mt-3">
                <div class="mb-3">
                    <label class="form-label">命令</label>
                    <select class="form-select" id="commandSelect" onchange="updateCommandParams()">
                        <option value="">選擇命令...</option>
                        <option value="spatiotemporal.suggest">時空建議</option>
                        <option value="spatiotemporal.schedule">排程活動</option>
                        <option value="spatiotemporal.analyze">分析模式</option>
                        <option value="system.status">系統狀態</option>
                        <option value="system.config">系統配置</option>
                    </select>
                </div>
                <div class="mb-3" id="commandParams"></div>
                <button class="btn btn-primary" onclick="executeCommand()">
                    <i class="bi bi-send"></i> 執行命令
                </button>
                <div id="commandResults" class="mt-3"></div>
            </div>
        </div>
        
        <!-- 時空系統快速操作 -->
        <div class="supervisor-card">
            <h3><i class="bi bi-calendar-event"></i> 時空系統快速操作</h3>
            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">建議活動時間</h5>
                            <button class="btn btn-outline-primary w-100" onclick="quickSuggestEvent()">
                                <i class="bi bi-lightbulb"></i> 智能建議
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">分析活動模式</h5>
                            <button class="btn btn-outline-primary w-100" onclick="quickAnalyzePatterns()">
                                <i class="bi bi-graph-up"></i> 模式分析
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8888/api';
        
        // 載入系統狀態
        async function loadSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/supervisor/status`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                
                // 安全地訪問嵌套屬性
                const supervisor = data.supervisor || {};
                const name = supervisor.name || '未知';
                const version = supervisor.version || '未知';
                const permissionLevel = supervisor.permission_level || '未知';
                const status = supervisor.status || '未知';
                const timestamp = data.timestamp || new Date().toISOString();
                
                const statusHtml = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>名稱:</strong> ${name}</p>
                            <p><strong>版本:</strong> ${version}</p>
                            <p><strong>權限等級:</strong> <span class="badge bg-danger">${permissionLevel}</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>狀態:</strong> <span class="badge bg-success">${status}</span></p>
                            <p><strong>時間:</strong> ${new Date(timestamp).toLocaleString('zh-TW')}</p>
                        </div>
                    </div>
                `;
                document.getElementById('systemStatus').innerHTML = statusHtml;
            } catch (error) {
                document.getElementById('systemStatus').innerHTML = `<div class="alert alert-danger">載入失敗: ${error.message}</div>`;
            }
        }
        
        // 載入能力清單
        async function loadCapabilities() {
            try {
                const response = await fetch(`${API_BASE}/supervisor/capabilities`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                
                // 安全地訪問 capabilities
                const capabilities = data.capabilities || {};
                
                let html = '';
                for (const [key, value] of Object.entries(capabilities)) {
                    if (!value || typeof value !== 'object') continue;
                    
                    const enabled = value.enabled || false;
                    const providers = value.providers || {};
                    
                    html += `
                        <div class="mb-3">
                            <h5>${key.toUpperCase()}</h5>
                            <span class="capability-badge ${enabled ? 'badge-enabled' : 'badge-disabled'}">
                                ${enabled ? '✓ 啟用' : '✗ 停用'}
                            </span>
                            ${enabled && Object.keys(providers).length > 0 ? Object.entries(providers).map(([k, v]) => 
                                `<span class="capability-badge ${v ? 'badge-enabled' : 'badge-disabled'}">${k}: ${v ? '✓' : '✗'}</span>`
                            ).join('') : ''}
                        </div>
                    `;
                }
                document.getElementById('capabilitiesList').innerHTML = html || '<p class="text-muted">無可用能力</p>';
            } catch (error) {
                document.getElementById('capabilitiesList').innerHTML = `<div class="alert alert-danger">載入失敗: ${error.message}</div>`;
            }
        }
        
        // 執行權限測試
        async function runPermissionTest() {
            const resultsDiv = document.getElementById('permissionTestResults');
            resultsDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
            
            try {
                const response = await fetch(`${API_BASE}/supervisor/test-permissions`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                
                // 安全地訪問 tests
                const tests = data.tests || {};
                const allPassed = data.all_passed || false;
                
                let html = '';
                for (const [key, value] of Object.entries(tests)) {
                    const passed = value === true;
                    html += `
                        <div class="permission-test ${passed ? 'test-passed' : 'test-failed'}">
                            <strong>${key}:</strong> ${passed ? '✓ 通過' : '✗ 失敗'}
                        </div>
                    `;
                }
                
                html += `
                    <div class="mt-3">
                        <strong>整體結果:</strong> 
                        <span class="badge ${allPassed ? 'bg-success' : 'bg-danger'}">
                            ${allPassed ? '全部通過' : '部分失敗'}
                        </span>
                    </div>
                `;
                
                resultsDiv.innerHTML = html || '<p class="text-muted">無測試結果</p>';
            } catch (error) {
                resultsDiv.innerHTML = `<div class="alert alert-danger">測試失敗: ${error.message}</div>`;
            }
        }
        
        // 更新命令參數
        function updateCommandParams() {
            const command = document.getElementById('commandSelect').value;
            const paramsDiv = document.getElementById('commandParams');
            
            if (command === 'spatiotemporal.suggest') {
                paramsDiv.innerHTML = `
                    <label class="form-label">事件類型</label>
                    <input type="text" class="form-control mb-2" id="eventType" value="meeting" placeholder="meeting">
                    <label class="form-label">參與人數</label>
                    <input type="number" class="form-control mb-2" id="participants" value="10">
                    <label class="form-label">持續時間（小時）</label>
                    <input type="number" class="form-control mb-2" id="durationHours" value="2">
                `;
            } else if (command === 'spatiotemporal.schedule') {
                paramsDiv.innerHTML = `
                    <label class="form-label">活動標題</label>
                    <input type="text" class="form-control mb-2" id="title" placeholder="活動名稱">
                    <label class="form-label">事件類型</label>
                    <input type="text" class="form-control mb-2" id="eventType" value="meeting">
                    <label class="form-label">參與人數</label>
                    <input type="number" class="form-control mb-2" id="participants" value="10">
                `;
            } else {
                paramsDiv.innerHTML = '';
            }
        }
        
        // 執行命令
        async function executeCommand() {
            const command = document.getElementById('commandSelect').value;
            if (!command) {
                alert('請選擇命令');
                return;
            }
            
            const resultsDiv = document.getElementById('commandResults');
            resultsDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
            
            // 收集參數
            const params = {};
            if (command === 'spatiotemporal.suggest') {
                params.event_type = document.getElementById('eventType')?.value || 'meeting';
                params.participants = parseInt(document.getElementById('participants')?.value || '10');
                params.duration_hours = parseFloat(document.getElementById('durationHours')?.value || '2');
            } else if (command === 'spatiotemporal.schedule') {
                params.title = document.getElementById('title')?.value || '新活動';
                params.event_type = document.getElementById('eventType')?.value || 'meeting';
                params.participants = parseInt(document.getElementById('participants')?.value || '10');
            }
            
            try {
                const response = await fetch(`${API_BASE}/supervisor/execute`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command, params})
                });
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="alert alert-${data.status === 'success' ? 'success' : 'danger'}">
                        <strong>狀態:</strong> ${data.status}<br>
                        <pre>${JSON.stringify(data.data || data.message, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="alert alert-danger">執行失敗: ${error.message}</div>`;
            }
        }
        
        // 快速操作
        async function quickSuggestEvent() {
            const result = await executeCommandDirect('spatiotemporal.suggest', {
                event_type: 'meeting',
                participants: 10,
                duration_hours: 2
            });
            alert('建議已生成，請查看命令執行結果');
        }
        
        async function quickAnalyzePatterns() {
            const result = await executeCommandDirect('spatiotemporal.analyze', {
                days: 30
            });
            alert('分析完成，請查看命令執行結果');
        }
        
        async function executeCommandDirect(command, params) {
            const response = await fetch(`${API_BASE}/supervisor/execute`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command, params})
            });
            return await response.json();
        }
        
        // 初始化
        window.onload = function() {
            loadSystemStatus();
            loadCapabilities();
            
            // 定期更新狀態
            setInterval(loadSystemStatus, 30000);
        };
    </script>
</body>
</html>
