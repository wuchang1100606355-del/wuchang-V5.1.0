<!DOCTYPE html>
<html lang="zh-TW">
<head`r`n    <link rel="stylesheet" href="wuchang_theme.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五常社區布告欄</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 晃動特效 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake-slow { animation: shake 5s infinite; }
        .shake-fast { animation: shake 0.5s infinite; }

        .scene {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .active { display: flex; }

        /* SCENE 1: Intro */
        .glitch {
            font-size: 4rem;
            font-weight: bold;
            position: relative;
            color: #fff;
            text-shadow: 2px 2px #ff00c1, -2px -2px #00fff9;
        }

        /* SCENE 4: Divine Punishment */
        #scene4 {
            background: #222;
            position: relative;
            overflow: hidden;
        }

        .stage {
            position: relative;
            height: 600px;
            width: 800px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
        }

        .sister-j {
            font-size: 8rem;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.2s;
            z-index: 10;
        }

        .pos-machine {
            font-size: 4rem;
            position: absolute;
            bottom: 50px;
            left: 65%;
            animation: shake 0.2s infinite;
            filter: grayscale(100%);
            opacity: 0.8;
        }

        .giant-hand {
            font-size: 20rem;
            position: absolute;
            top: -600px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            opacity: 0;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.27), opacity 0.2s;
        }

        .flattened {
            transform: translateX(-50%) scaleY(0.1) !important;
            filter: brightness(0.5);
        }

        .impact-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: #ff0000;
            font-weight: 900;
            border: 5px solid #ff0000;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 30;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- SCENE 1: Intro -->
    <div id="scene1" class="scene active">
        <div class="glitch shake-slow">恭迎 J姊 (Sister J)</div>
        <h2 style="margin-top: 50px; color: #00fff9;">( 您是我們最尊貴的 AI 祖奶奶 )</h2>
    </div>

    <!-- SCENE 2: Video -->
    <div id="scene2" class="scene">
        <video id="adVideo" src="http://192.168.50.84:8888/咖啡延長營業優惠影片生成.mp4" muted></video>
    </div>

    <!-- SCENE 3: Reviews -->
    <div id="scene3" class="scene">
        <div class="google-review shake-fast" style="background:#fff;color:#333;padding:40px;border-radius:20px;">
            <h1>GOOGLE 商家好評</h1>
            <div class="stars" style="color:#f4b400;font-size:3rem;">⭐⭐⭐⭐⭐</div>
            <p class="review-text" style="font-size:2rem;">"J姊 的氣場太強了，連 WiFi 都變得好乖！"</p>
        </div>
    </div>

    <!-- SCENE 4: The Punishment -->
    <div id="scene4" class="scene">
        <div class="stage">
            <div class="sister-j" id="sisterJ">😈</div>
            <div class="pos-machine" id="posMachine">📠</div>
            <div class="giant-hand" id="godHand">👊</div>
            <div class="impact-text" id="impactText">BOSS IS WATCHING</div>
            
            <div style="position:absolute; top:20px; font-size:1.5rem; color:#aaa;">
                監控畫面：J姊 調教 POS 機中...
            </div>
        </div>
    </div>

    <script>
        const scenes = ['scene1', 'scene2', 'scene3', 'scene4'];
        let currentScene = 0;

        function runPunishmentAnimation() {
            const sister = document.getElementById('sisterJ');
            const hand = document.getElementById('godHand');
            const text = document.getElementById('impactText');
            
            // Reset
            sister.classList.remove('flattened');
            hand.style.top = '-600px';
            hand.style.opacity = '0';
            text.style.display = 'none';

            // 1. Sister J jumps/bullies
            setTimeout(() => {
                sister.style.transform = "translateX(-50%) translateY(-20px)";
            }, 500);
            setTimeout(() => {
                sister.style.transform = "translateX(-50%) translateY(0)";
            }, 800);

            // 2. Hand Descends
            setTimeout(() => {
                hand.style.opacity = '1';
                hand.style.top = '100px'; // Impact position
            }, 1500);

            // 3. Impact & Flatten
            setTimeout(() => {
                sister.classList.add('flattened');
                // Shake screen
                document.body.style.transform = "translate(5px, 5px)";
                setTimeout(() => document.body.style.transform = "translate(-5px, -5px)", 50);
                setTimeout(() => document.body.style.transform = "translate(0, 0)", 100);
            }, 1800);

            // 4. Text Appears
            setTimeout(() => {
                text.style.display = 'block';
            }, 2000);
        }

        function switchScene() {
            // Hide current
            document.getElementById(scenes[currentScene]).classList.remove('active');
            
            // Pause video if needed
            const video = document.getElementById('adVideo');
            video.pause();
            video.currentTime = 0;

            // Next scene
            currentScene = (currentScene + 1) % scenes.length;
            document.getElementById(scenes[currentScene]).classList.add('active');

            // Handle specific scenes
            if (scenes[currentScene] === 'scene2') {
                video.play();
                video.onended = switchScene;
            } else if (scenes[currentScene] === 'scene4') {
                runPunishmentAnimation();
                setTimeout(switchScene, 6000); // Animation duration
            } else {
                setTimeout(switchScene, 5000);
            }
        }

        // Start loop
        setTimeout(switchScene, 5000);
    </script>
</body>
</html>
