<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wuchang Voice Link (五常語音連結)</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffcc;
        }
        #status {
            margin-bottom: 20px;
            font-size: 1rem;
            min-height: 1.5em;
        }
        .mic-btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .mic-btn:active, .mic-btn.listening {
            background: rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.8);
            transform: scale(1.1);
        }
        #transcript {
            margin-top: 30px;
            padding: 10px;
            border: 1px dashed #00ffcc;
            min-height: 100px;
            font-size: 1rem;
            text-align: left;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            overflow-y: auto;
            max-height: 200px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CORE AI SISTER<br>VOICE LINK</h1>
        <div id="status">Tap to Speak (按住說話)</div>
        <button id="micBtn" class="mic-btn">🎙️</button>
        <div id="transcript">Waiting for input...</div>
        <div class="footer">Wuchang Flagship V6.0.0<br>Shared Sovereignty System</div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        let recognition;

        // Initialize Web Speech API
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'zh-TW'; // Traditional Chinese

            recognition.onstart = function() {
                statusDiv.innerText = "Listening (聆聽中)...";
                micBtn.classList.add('listening');
            };

            recognition.onend = function() {
                statusDiv.innerText = "Processing (處理中)...";
                micBtn.classList.remove('listening');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                transcriptDiv.innerHTML = "You: " + transcript + "<br>...";
                sendToSister(transcript);
            };

            recognition.onerror = function(event) {
                statusDiv.innerText = "Error: " + event.error;
            };
        } else {
            statusDiv.innerText = "Browser not supported (Use Safari/Chrome).";
            micBtn.disabled = true;
        }

        micBtn.onclick = function() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    console.log("Already started");
                }
            }
        };

        async function sendToSister(text) {
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                transcriptDiv.innerHTML = "You: " + text + "<br><span style='color:#00ffcc'>Sister: " + data.response + "</span>";
                speak(data.response);
                statusDiv.innerText = "Tap to Speak (按住說話)";
            } catch (error) {
                transcriptDiv.innerHTML += "<br>Error connecting to server.";
                statusDiv.innerText = "Connection Error";
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                // Try to select a female voice if available
                const voices = window.speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Meijia') || v.name.includes('Yaoyao') || v.name.includes('Ting-Ting') || v.name.includes('Google')));
                if (femaleVoice) utterance.voice = femaleVoice;
                
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
