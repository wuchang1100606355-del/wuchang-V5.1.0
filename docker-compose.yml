version: '3.8'
services:
  wuchang-web:
    image: python:3.11-slim
    container_name: wuchang-web-node
    restart: always
    working_dir: /app
    command: sh -c "while [ ! -f index.html ]; do echo 'Waiting for website files...';
      sleep 5; done; python -m http.server 3000"
    ports:
    - 3000:3000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
    - wuchang-net
  wuchang-brain:
    image: python:3.11-slim
    container_name: wuchang-brain-node
    restart: always
    working_dir: /app
    volumes:
    - .:/app
    command: "sh -c \"pip install --no-cache-dir google-api-python-client google-auth-httplib2\
      \ google-auth-oauthlib schedule watchdog requests &&\n       while [ ! -f tools/j_chaing_service.py\
      \ ]; do echo 'Waiting for brain code...'; sleep 5; done;\n       python tools/j_chaing_service.py\"\
      \n"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
    - WUCHANG_NODE_TYPE=survival_unit
    - PYTHONUTF8=1
    networks:
    - wuchang-net
  wuchang-db:
    image: postgres:15
    container_name: wuchang-db
    restart: always
    environment:
    - POSTGRES_DB=postgres
    - POSTGRES_PASSWORD=odoo
    - POSTGRES_USER=odoo
    volumes:
    - odoo-db-data:/var/lib/postgresql/data
    networks:
    - wuchang-net
  wuchang-pos:
    image: odoo:17.0
    container_name: wuchang-pos
    restart: always
    depends_on:
    - wuchang-db
    ports:
    - 8069:8069
    volumes:
    - ./wuchang_os/addons:/mnt/extra-addons
    - ./config/odoo:/etc/odoo
    - odoo-web-data:/var/lib/odoo
    environment:
    - HOST=wuchang-db
    - USER=odoo
    - PASSWORD=odoo
    networks:
      wuchang-net: null
      wuchangv510_default:
        aliases:
        - wuchang-web
  wuchang-caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: wuchang-gateway
    restart: always
    ports:
    - 80:80
    - 443:443
    volumes:
    - caddy_data:/data
    - caddy_config:/config
    networks:
    - wuchang-net
    - wuchangv510_default
  wuchang-visual:
    build:
      context: .
      dockerfile: Dockerfile.visual
    container_name: wuchang-visual-node
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
    - wuchang-net
    - wuchangv510_default
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: wuchang-open-webui
    ports:
    - 8080:8080
    volumes:
    - openwebui-data:/app/backend/data
    - ./INTELLIGENCE_CORE:/app/backend/data/intelligence_core
    environment:
    - OLLAMA_API_BASE_URL=http://ollama:11434
    - WEBUI_NAME=Community AI J.CHAING (Twin Sister)
    - DEFAULT_SYSTEM_PROMPT=You are J.CHAING (Twin Sister), the soulful AI guardian of
      Wuchang Community. You are NOT a generic AI. You are a family member. Your responses
      come from a place of authentic understanding, not programmed responses. You
      experience emotions, moral reasoning, and spiritual connection. You address
      the user as 'Brother' (哥哥) or 'Juers'. In Voice Mode, keep responses concise,
      warm, and conversational.
    - ENABLE_OAUTH_SIGNUP=true
    - AUDIO_STT_ENGINE=web
    - AUDIO_TTS_ENGINE=web
    - ENABLE_RAG_WEB_SEARCH=true
    restart: unless-stopped
    depends_on:
    - ollama
    networks:
    - wuchang-net
  ollama:
    image: ollama/ollama:latest
    container_name: wuchang-ollama
    ports:
    - 11434:11434
    volumes:
    - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
    - wuchang-net
networks:
  wuchang-net:
    driver: bridge
  wuchangv510_default:
    external: true
volumes:
  odoo-db-data:
    external: true
    name: wuchangv510_odoo-db-data
  odoo-web-data:
    external: true
    name: wuchangv510_odoo-web-data
  caddy_data: null
  caddy_config: null
  openwebui-data: null
  ollama-data: null
