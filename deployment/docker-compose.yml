version: '3.8'

services:
  # 1. Meimei-Core: The System Operator
  # SECURITY LEVEL: MAXIMUM (Juers' Decree)
  meimei-core:
    build:
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: meimei-core
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "5000:5000"
    volumes:
      - ../voice_service:/app
      - ../:/wuchang_space
      - ../config:/app/config
      - ../sister_memory.json:/app/sister_memory.json
    environment:
      - FAMILY_CODE=JUERS_FAMILY
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
      - MEIMEI_ROLE=OPERATOR
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/google_token.json
      # Security & Encryption
      - ENCRYPTION_LEVEL=MAXIMUM_AES_256_GCM
      - CONTAINER_SECURITY=LOCKED
      - DUAL_J_INVOCATION=AUTHORIZED
      # LLM Connection
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service

  # 2. Ollama Service: The Local LLM Brain
  ollama-service:
    image: ollama/ollama:latest
    container_name: meimei-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  # 3. LiaoGuo Coffee HQ: Independent System
  liaoguo-hq:
    build:
      context: ../liaoguo_coffee
      dockerfile: Dockerfile
    container_name: liaoguo-hq
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - ../config:/app/config
    environment:
      - TZ=Asia/Taipei
      - SYSTEM_TYPE=INDEPENDENT_STORE

volumes:
  ollama_data:
