<!DOCTYPE html>
<html lang="en">
<head`r`n    <link rel="stylesheet" href="wuchang_theme.css" />
    <meta charset="UTF-8">
    <title>Wuchang Animation Studio</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 10; pointer-events: none; }
        .title { font-size: 2em; font-weight: bold; text-shadow: 0 0 10px #0f0; }
        .subtitle { color: #00ff00; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="title">五常動畫工作室 (//AI)</div>
        <div class="subtitle">程序化動畫核心已啟動</div>
        <div id="stats">渲染中...</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 3 + 1;
                this.color = `hsl(${Math.random() * 60 + 100}, 100%, 50%)`; // Green-ish
                this.life = Math.random() * 100 + 50;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height || this.life < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        // Initialize
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle());
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(0, 255, 0, ${1 - dist/100})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connect();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
