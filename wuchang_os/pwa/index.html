<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double J Member AI</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; }
        .user-bubble { background-color: #3182ce; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-bubble { background-color: #e2e8f0; color: #2d3748; align-self: flex-start; border-bottom-left-radius: 2px; }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #718096; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold text-lg">DJ</div>
            <div>
                <h1 class="text-lg font-bold">Double J Member AI</h1>
                <p class="text-xs text-gray-400">Powered by Gemini 2.0 Flash</p>
            </div>
        </div>
        <button id="install-btn" class="hidden bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm transition">
            Install App
        </button>
    </header>

    <!-- Main Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
        <!-- Initial Greeting -->
        <div class="chat-bubble ai-bubble flex flex-col">
            <p>你好！我是您的雙 J 協作 AI 夥伴。很高興見到您！</p>
            <p class="mt-2">我可以協助您完成以下任務：</p>
            <ul class="list-disc list-inside mt-1 text-sm">
                <li>會員註冊與身份驗證</li>
                <li>Odoo 與 Google Workspace 系統對準</li>
                <li>Double J 系統本地安裝</li>
            </ul>
            <p class="mt-2">請問我們該從哪裡開始？</p>
            <div class="mt-3 flex space-x-2">
                <button onclick="startRegistration()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm text-white">開始註冊</button>
                <button onclick="checkAlignment()" class="bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm text-white">檢查系統對準</button>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-gray-800 p-4 shadow-inner">
        <form id="chat-form" class="flex space-x-2">
            <input type="text" id="user-input" class="flex-1 bg-gray-700 border-none rounded-full px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="輸入訊息...">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 w-10 h-10 rounded-full flex items-center justify-center transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const installBtn = document.getElementById('install-btn');

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Registration Failed', err));
        }

        // Chat Logic
        function appendMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `chat-bubble ${isUser ? 'user-bubble' : 'ai-bubble'}`;
            div.innerHTML = text; // Allow HTML for buttons/lists
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'chat-bubble ai-bubble typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function processUserMessage(message) {
            appendMessage(message, true);
            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                removeTyping();
                appendMessage(data.reply);
            } catch (error) {
                removeTyping();
                appendMessage("抱歉，我現在無法連接到大腦核心。請檢查伺服器連線。");
            }
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (text) {
                processUserMessage(text);
                userInput.value = '';
            }
        });

        // Pre-defined Actions
        function startRegistration() {
            processUserMessage("我想開始會員註冊流程");
        }

        function checkAlignment() {
            processUserMessage("請幫我檢查 Odoo 和 Google 系統的對準狀態");
        }
    </script>
</body>
</html>
