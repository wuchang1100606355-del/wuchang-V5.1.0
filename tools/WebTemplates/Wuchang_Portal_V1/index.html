<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUCHANG COMMUNITY PORTAL | 五常雲端社區</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <div class="logo">WUCHANG <span class="highlight">OS</span></div>
            <nav>
                <a href="#" class="active">HOME</a>
                <a href="#">SERVICES</a>
                <a href="#">COMMUNITY</a>
                <a href="#">ABOUT</a>
            </nav>
        </header>
        
        <main>
            <div class="hero">
                <h1>FUTURE IS <span class="glitch" data-text="NOW">NOW</span></h1>
                <p>Empowering the Community with AI & Soul.</p>
                <div class="cta-group">
                    <button class="primary">ENTER SYSTEM</button>
                    <button class="secondary">LEARN MORE</button>
                </div>
            </div>
            
            <div class="status-panel">
                <div class="status-item">
                    <span class="label">SYSTEM STATUS</span>
                    <span class="value online">ONLINE</span>
                </div>
                <div class="status-item">
                    <span class="label">AI NODES</span>
                    <span class="value">20 ACTIVE</span>
                </div>
                <div class="status-item">
                    <span class="label">LOCATION</span>
                    <span class="value">TAIPEI / WUCHANG</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 Wuchang Community Cloud. Powered by Little J.</p>
        </footer>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
