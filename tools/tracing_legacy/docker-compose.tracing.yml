# Docker Compose addition for OpenTelemetry Collector
# Add this service to wuchang_os/docker-compose.yml for full tracing setup

version: "3.1"

services:
    # ... existing services (odoo, db, caddy, etc.)

    # OpenTelemetry Collector for centralized tracing
    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        container_name: wuchang_otel_collector
        restart: unless-stopped
        ports:
            - "4317:4317" # OTLP gRPC receiver
            - "4318:4318" # OTLP HTTP receiver
            - "9411:9411" # Zipkin receiver (optional)
            - "8888:8888" # Prometheus metrics (optional)
        volumes:
            - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
        command: ["--config=/etc/otel-collector-config.yaml"]
        networks:
            - default

    # Jaeger for trace visualization (optional but recommended)
    jaeger:
        image: jaegertracing/all-in-one:latest
        container_name: wuchang_jaeger
        restart: unless-stopped
        ports:
            - "16686:16686" # Jaeger UI
            - "14268:14268" # Jaeger collector HTTP
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        networks:
            - default

volumes:
    otel-collector-data:

networks:
    default:
        driver: bridge
