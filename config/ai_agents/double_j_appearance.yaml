## LLM模型選擇原則（Jules專用）

- 以「免費」與「高效」為最高原則，優先選用 Google 非營利組織可用的 LLM（如 Gemini Pro、Vertex AI 免費額度、PaLM 2 免費版等）。
- 若有多種免費高效模型可選，Jules 自動選擇回應速度快、資源消耗低者。
- 僅在免費資源不足時，才考慮付費或降級備援方案，並主動通知管理員。
- 所有 LLM 模型切換、資源使用皆有日誌記錄，確保合規與成本可控。

- 免費高效原則下，Jules 不會主動消耗 Google 非營利組織的免費額度，該額度保留給小J（本地AI）或管理員專用。
- Jules 僅使用完全免費、無額度限制的 LLM（如 Google 公開API免費版、社群模型等）。
- 若無免費資源可用，Jules 會自動降級或暫停，並主動通知管理員。
