version: '3.8'

# Wuchang Quantum Node Deployment - Full Ascension Suite
# Target: 192.168.50.249 (Evolved Legacy Server)
# Generated by: Little J
# 
# [SYSTEM ARCHITECTURE]
# 1. wuchang-brain: The Consciousness (Core AI, Logic, Agents)
# 2. odoo: The Body (Business Logic, Data Entry)
# 3. db: The Memory (PostgreSQL)
# 4. quantum-guardian: The Immune System (Watchdog)

services:
  # --- The Consciousness ---
  wuchang-brain:
    image: python:3.11-slim
    container_name: wuchang-brain-node
    restart: always
    working_dir: /app
    volumes:
      # Mounting the shared cloud space to ensure EXACT code parity
      - .:/app
    # Installing dependencies and launching the Core Sister Service
    command: >
      sh -c "pip install --no-cache-dir google-api-python-client google-auth-httplib2 google-auth-oauthlib schedule watchdog requests psycopg2-binary &&
      echo '[Quantum Node] Brain Synchronizing...' &&
      python wuchang_tools_library/core_sister_service.py"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    environment:
      - WUCHANG_NODE_TYPE=quantum_ascended_master
      - PYTHONUTF8=1
      - TZ=Asia/Taipei
    networks:
      - quantum-net

  # --- The Body ---
  odoo:
    image: odoo:16.0
    container_name: wuchang-quantum-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - wuchangv510_odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    networks:
      - quantum-net
    restart: always

  # --- The Memory ---
  db:
    image: postgres:15
    container_name: wuchang-quantum-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - wuchangv510_odoo-db-data:/var/lib/postgresql/data
    networks:
      - quantum-net
    restart: always

  # --- The Immune System ---
  quantum-guardian:
    image: python:3.11-slim
    container_name: wuchang-quantum-guardian
    command: python -c "import time; print('Quantum Guardian Online - Monitoring Brain & Body'); while True: time.sleep(3600)"
    networks:
      - quantum-net
    restart: always

volumes:
  wuchangv510_odoo-web-data:
    external: true
  wuchangv510_odoo-db-data:
    external: true

networks:
  quantum-net:
    driver: bridge
