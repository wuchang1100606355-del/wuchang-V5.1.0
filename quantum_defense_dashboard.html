<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五常量子防禦儀表板 | Wuchang Quantum Defense</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 2px solid #0f0;
            padding: 40px;
            box-shadow: 0 0 20px #0f0;
            background: rgba(0, 20, 0, 0.8);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        .stat-box {
            margin: 0 20px;
        }
        .number {
            font-size: 4em;
            font-weight: bold;
            display: block;
            text-shadow: 0 0 15px #0f0;
        }
        .label {
            font-size: 1.2em;
            color: #aaa;
        }
        .log-window {
            margin-top: 30px;
            height: 150px;
            overflow: hidden;
            text-align: left;
            border-top: 1px dashed #0f0;
            padding-top: 10px;
            font-size: 0.9em;
            color: #0a0;
        }
        /* Quantum Background Effect */
        .background-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
            opacity: 0.3;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { text-shadow: 0 0 10px #0f0; }
            50% { text-shadow: 0 0 25px #0f0, 0 0 5px #fff; }
            100% { text-shadow: 0 0 10px #0f0; }
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    <div class="container">
        <h1>🛡️ Wuchang Quantum Defense System</h1>
        <p>Active Defense Protocol: <span style="color:red">SINGULARITY (奇點)</span></p>
        
        <div class="stats">
            <div class="stat-box">
                <span id="absorbed-count" class="number pulse">0</span>
                <span class="label">已吸引攻擊數 (Absorbed)</span>
            </div>
            <div class="stat-box">
                <span id="eliminated-count" class="number pulse">0</span>
                <span class="label">已消滅威脅數 (Eliminated)</span>
            </div>
        </div>

        <div class="log-window" id="log-window">
            <div>[SYSTEM] Event Horizon Initialized...</div>
            <div>[SYSTEM] Waiting for hostile entities...</div>
        </div>
    </div>

    <script>
        // Simulation Logic (since we don't have a real backend websocket in this static file)
        let absorbed = 0;
        let eliminated = 0;
        const logWindow = document.getElementById('log-window');
        
        function updateStats() {
            // Randomly simulate attacks
            if (Math.random() > 0.3) {
                absorbed++;
                document.getElementById('absorbed-count').innerText = absorbed;
                
                // Log entry
                const ip = Math.floor(Math.random() * 255) + "." + Math.floor(Math.random() * 255) + ".*.*";
                addLog(`[WARNING] Threat detected from ${ip}`);

                // Simulate elimination delay
                setTimeout(() => {
                    eliminated++;
                    document.getElementById('eliminated-count').innerText = eliminated;
                    addLog(`[SUCCESS] Threat from ${ip} crushed into singularity.`);
                }, Math.random() * 1000);
            }
        }

        function addLog(msg) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logWindow.prepend(div);
            if (logWindow.children.length > 8) {
                logWindow.removeChild(logWindow.lastChild);
            }
        }

        setInterval(updateStats, 1500);
    </script>
</body>
</html>
