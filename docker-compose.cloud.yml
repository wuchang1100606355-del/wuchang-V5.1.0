# Docker Compose 雲端部署配置
# 優化用於雲端環境（如 Google Cloud Run, AWS ECS 等）

version: '3.8'

services:
  # Odoo ERP 系統（雲端優化）
  wuchang-web:
    image: odoo:17.0        
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./wuchang_os/addons:/mnt/extra-addons
      - ./config:/mnt/jules-config:ro
    command: odoo -d admin --db_host=db --db_user=odoo --db_password=${DB_PASSWORD:-odoo} --proxy-mode --longpolling-port=8072     
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=${DB_PASSWORD:-odoo}
      - PGDATABASE=postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    profiles:
      - cloud

  # PostgreSQL 資料庫（雲端優化）
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-odoo}
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - cloud

  # Ollama LLM 服務（雲端配置）
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    profiles:
      - cloud

volumes:
  odoo-web-data:
  odoo-db-data:
  ollama-data:

# 雲端部署環境變數範例：
# DB_NAME=postgres
# DB_USER=odoo
# DB_PASSWORD=your_secure_password
#
# 使用方式：
# docker-compose -f docker-compose.cloud.yml --profile cloud up -d
#
# 注意：
# - 此配置適合部署到雲端平台
# - 已設定資源限制以符合雲端環境
# - 建議使用環境變數設定敏感資訊（密碼等）
